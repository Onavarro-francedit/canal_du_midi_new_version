<title>Planificateur Canal du Midi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout : assistant conversationnel (orbe IA + composer + idées par thème → chat), sous la navbar 2026.
   Tokens = pages 2026 (violet #6a63d9, eau #2BB6C4, Sora / Manrope). */
:root{
  --accent:#6a63d9; --accent-ink:#4f48b7; --accent-soft:#ebe9fb;
  --ink:#1f2340; --ink-2:#3a3e5c; --muted:#6c718d;
  --line:#eceaf6; --line-2:#e0def0; --bg:#fcf8ff; --card:#ffffff; --chip:#f5f6fb;
  --o1:#8a7ee8; --o2:#2BB6C4; --o3:#f1c7bc; --o4:#bcdff7;
  --t-boat-bg:#e6f6f8; --t-boat:#13606b; --t-bike-bg:#eaf6ee; --t-bike:#1d6b3f; --t-family-bg:#fdf1e6; --t-family:#8a4510;
  --t-food-bg:#fbecf1; --t-food:#8e2a5b; --t-love-bg:#ebe9fb; --t-love:#4f48b7;
  --dark:#0E1424; --on-dark:#ffffff; --on-accent:#ffffff;
  --f-head:'Sora',system-ui,sans-serif; --f-body:'Manrope',system-ui,sans-serif;
  --spd:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --accent:#8a83f0; --accent-ink:#c2bdfa; --accent-soft:#2a2850; --ink:#f1f1fa; --ink-2:#d0d2e6; --muted:#a2a6c2;
  --line:#2a2c40; --line-2:#34364d; --bg:#12131d; --card:#1b1d2b; --chip:#232537;
  --t-boat-bg:#163a40; --t-boat:#8fe0ea; --t-bike-bg:#183324; --t-bike:#9fdcb5; --t-family-bg:#3a2a1a; --t-family:#f2c39a;
  --t-food-bg:#3a1c2a; --t-food:#f2a9c8; --t-love-bg:#2a2850; --t-love:#c2bdfa;
  --dark:#f1f1fa; --on-dark:#12131d; color-scheme:dark}}
:root[data-theme="dark"]{
  --accent:#8a83f0; --accent-ink:#c2bdfa; --accent-soft:#2a2850; --ink:#f1f1fa; --ink-2:#d0d2e6; --muted:#a2a6c2;
  --line:#2a2c40; --line-2:#34364d; --bg:#12131d; --card:#1b1d2b; --chip:#232537;
  --t-boat-bg:#163a40; --t-boat:#8fe0ea; --t-bike-bg:#183324; --t-bike:#9fdcb5; --t-family-bg:#3a2a1a; --t-family:#f2c39a;
  --t-food-bg:#3a1c2a; --t-food:#f2a9c8; --t-love-bg:#2a2850; --t-love:#c2bdfa;
  --dark:#f1f1fa; --on-dark:#12131d; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--f-body);color:var(--ink);background:var(--bg);margin:0;display:flex;flex-direction:column;overflow:hidden}
h1,h2,h3,strong{font-family:var(--f-head)}
button{font-family:inherit;cursor:pointer}
svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Navbar 2026 (copie visuelle de cdm-header) ---------- */
.nav{background:var(--card);border-bottom:1px solid var(--line);flex:none;z-index:10}
.nav-in{width:min(1360px,100%);margin-inline:auto;padding-inline:16px;display:flex;align-items:center;gap:18px;height:72px}
.brand{display:flex;align-items:center;gap:12px;font:700 17px var(--f-head);color:var(--ink);text-decoration:none;margin-right:auto}
.brand i{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#66c7c7,#6a63d9)}
.menu{display:flex;gap:22px;font-size:14.5px;font-weight:500;color:var(--ink)}
.tools{display:flex;gap:18px;align-items:center;font-size:14.5px;font-weight:500}
.tools .t{display:inline-flex;gap:6px;align-items:center}
.cta{display:inline-flex;align-items:center;gap:8px;height:42px;padding:0 18px;border-radius:99px;color:#fff;text-decoration:none;font-weight:700;font-size:14.5px;
  background:linear-gradient(135deg,#6a63d9,#8a7ee8);box-shadow:0 0 0 3px rgba(106,99,217,.22)}
.avatar{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center}
@media (max-width:1180px){.menu,.tools .t{display:none}.nav-in{height:64px}}
@media (max-width:520px){.cta span{display:none}.cta{padding:0 12px}}

/* ---------- Layout ---------- */
/* une seule hauteur d'écran : rien ne défile hors de la conversation */
.main{flex:1;min-height:0;display:flex;justify-content:center;padding:clamp(8px,2vh,20px) 16px clamp(12px,2.4vh,24px)}
.wrap{width:100%;max-width:860px;height:100%;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:clamp(12px,2.4vh,24px)}
.wrap.chatting{justify-content:flex-start}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center}
.hello{margin:0;font:600 clamp(16px,2.2vh,19px) var(--f-head);color:var(--accent-ink)}
.hero h1{margin:4px 0 0;white-space:nowrap;font-size:clamp(19px,min(6.2vw,5vh),42px);font-weight:700;letter-spacing:-.025em;line-height:1.1;text-wrap:balance}

/* ---------- Orbe IA ---------- */
.orb{position:relative;width:var(--size,140px);height:var(--size,140px);flex-shrink:0}
.orb--hero{--size:clamp(96px,19vh,200px);margin:0 0 clamp(14px,2.6vh,26px)}
.orb--sm{--size:38px}.orb--xs{--size:32px}
.orb__glow{position:absolute;inset:-35%;border-radius:50%;background:radial-gradient(circle,rgba(138,126,232,.45) 0%,rgba(43,182,196,.18) 40%,transparent 70%);filter:blur(18px);animation:orbPulse calc(4s / var(--spd)) ease-in-out infinite}
.orb__core{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:radial-gradient(circle,#EDE9FF 0%,#C9C0FA 60%,#A99BF5 100%);animation:orbBreath calc(5s / var(--spd)) ease-in-out infinite}
.orb__blob{position:absolute;width:70%;height:70%;border-radius:50%;filter:blur(calc(var(--size,140px)*.14));mix-blend-mode:multiply;opacity:.9}
.b1{background:var(--o1);top:-10%;left:-10%;animation:drift1 calc(7s / var(--spd)) ease-in-out infinite}
.b2{background:var(--o2);bottom:-15%;right:-10%;animation:drift2 calc(9s / var(--spd)) ease-in-out infinite}
.b3{background:var(--o3);bottom:-5%;left:-5%;width:55%;height:55%;animation:drift3 calc(8s / var(--spd)) ease-in-out infinite}
.b4{background:var(--o4);top:5%;right:0;width:50%;height:50%;mix-blend-mode:screen;animation:drift1 calc(11s / var(--spd)) ease-in-out infinite reverse}
.orb__swirl{position:absolute;inset:-20%;background:conic-gradient(from 0deg,transparent 0 20%,rgba(255,255,255,.55) 30%,transparent 45% 70%,rgba(255,255,255,.35) 80%,transparent 90%);filter:blur(10px);mix-blend-mode:soft-light;animation:spin calc(6s / var(--spd)) linear infinite}
.orb__shine{position:absolute;top:9%;left:18%;width:42%;height:26%;border-radius:50%;background:radial-gradient(ellipse at center,rgba(255,255,255,.95),rgba(255,255,255,0) 70%);filter:blur(2px);transform:rotate(-20deg)}
.orb--hero .orb__core{overflow:visible;background:radial-gradient(circle,rgba(237,233,255,.9) 0%,rgba(201,192,250,.55) 45%,transparent 70%);filter:blur(calc(var(--size)*.045)) saturate(1.3);animation:orbBreath calc(5s / var(--spd)) ease-in-out infinite,spin calc(18s / var(--spd)) linear infinite}
.orb--hero .orb__blob{width:62%;height:62%;filter:blur(calc(var(--size)*.09));mix-blend-mode:normal;opacity:.85}
.orb--hero .b1{top:4%;left:4%}.orb--hero .b2{bottom:4%;right:4%}
.orb--hero .b3{bottom:8%;left:10%;width:50%;height:50%}
.orb--hero .b4{top:10%;right:12%;width:45%;height:45%;mix-blend-mode:screen;opacity:.9}
.orb--hero .orb__swirl{inset:0;border-radius:50%;filter:blur(calc(var(--size)*.07));opacity:.6}
.orb--hero .orb__shine{top:22%;left:28%;width:34%;height:22%;filter:blur(calc(var(--size)*.05));opacity:.7}
.orb--hero .orb__glow{inset:-18%;filter:blur(calc(var(--size)*.12))}
/* « pense » sans jamais toucher aux durées : changer une durée en cours fait sauter l'animation.
   On passe par des transitions (échelle, éclat, tourbillon). */
.orb{transition:transform .8s cubic-bezier(.2,.7,.2,1),filter .8s ease}
.orb__swirl{transition:opacity .8s ease}
.orb.is-thinking{transform:scale(1.07);filter:saturate(1.35) brightness(1.06)}
.orb.is-thinking .orb__swirl{opacity:1}
@keyframes orbBreath{0%,100%{scale:1}50%{scale:1.05}}
@keyframes orbPulse{0%,100%{opacity:.7;scale:1}50%{opacity:1;scale:1.08}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(35%,20%) scale(1.15)}66%{transform:translate(10%,40%) scale(.9)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(-30%,-25%) scale(.9)}66%{transform:translate(-45%,5%) scale(1.2)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40%,-40%) scale(1.25)}}

/* ---------- Composer ---------- */
.composer{position:relative;flex:none;display:flex;align-items:flex-end;gap:12px;padding:18px 14px 14px 22px;border-radius:24px;background:var(--card);border:1px solid var(--line-2);box-shadow:0 18px 50px rgba(61,72,124,.12);transition:box-shadow .2s,border-color .2s}
.composer:focus-within{border-color:#cfc8f7;box-shadow:0 18px 50px rgba(61,72,124,.18)}
.composer textarea{flex:1;border:none;resize:none;outline:none;font:inherit;font-size:18px;line-height:1.5;color:var(--ink);background:transparent;min-height:52px;padding:2px 0}
.composer textarea::placeholder{color:var(--muted)}
.send-btn{width:50px;height:50px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;flex-shrink:0;box-shadow:0 6px 18px rgba(106,99,217,.4);transition:transform .15s,opacity .15s}
.send-btn:hover{transform:translateY(-1px)}
.send-btn:disabled{opacity:.45;cursor:default;transform:none}
.send-btn svg{width:20px;height:20px;stroke-width:2.2}

/* ---------- Idées ---------- */
.ideas{display:flex;flex-direction:column;gap:clamp(8px,1.6vh,14px);flex:none}
.ideas-head{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink-2)}
.ideas-head svg{width:16px;height:16px;color:var(--accent)}
.ideas-head .cur{background:linear-gradient(90deg,#6a63d9,#2BB6C4,#c16b9c,#6a63d9);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shimmer 4s linear infinite}
@keyframes shimmer{to{background-position:-300% 0}}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.cat{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-size:14px;font-weight:600;transition:all .25s}
.cat svg{width:17px;height:17px}
.cat:hover{border-color:#cfc8f7}
.cat.is-active{background:var(--dark);border-color:var(--dark);color:var(--on-dark);box-shadow:0 6px 18px rgba(14,20,36,.18)}
/* hauteur fixe : cartes et squelettes occupent exactement la même place, rien ne bouge pendant la mise à jour */
.cards{--cards-h:184px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;height:var(--cards-h);flex:none}
.cards>*{height:100%;min-height:0;overflow:hidden}
.card .desc{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card{position:relative;text-align:left;display:flex;flex-direction:column;gap:8px;padding:clamp(12px,1.8vh,16px);border-radius:18px;border:1px solid var(--line);background:var(--card);color:var(--muted);font-size:13.5px;line-height:1.45;transition:border-color .2s,box-shadow .2s,transform .2s;animation:cardIn .5s cubic-bezier(.2,.7,.2,1) both}
.card:hover{border-color:#cfc8f7;box-shadow:0 10px 28px rgba(61,72,124,.12);transform:translateY(-3px)}
.card strong{font-size:15.5px;color:var(--ink);line-height:1.3}
.card-top{display:flex;align-items:center;justify-content:space-between}
.card-ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.card-ico svg{width:20px;height:20px}
.card-go{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:var(--ink-2);background:var(--chip);transition:background .2s,color .2s}
.card:hover .card-go{background:var(--accent);color:var(--on-accent)}
.card-go svg{width:16px;height:16px}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.meta span{padding:4px 10px;border-radius:999px;background:var(--chip);border:1px solid var(--line);font-size:12px;font-weight:600;color:var(--ink-2)}
.card.out{animation:cardOut .3s ease-in both}
@keyframes cardIn{from{opacity:0;transform:translateY(12px);filter:blur(6px)}to{opacity:1;transform:none;filter:none}}
@keyframes cardOut{to{opacity:0;transform:translateY(-8px);filter:blur(6px)}}
.skel{border-radius:18px;border:1px solid var(--line);background:var(--card);padding:18px;display:flex;flex-direction:column;gap:12px}
.skel i{display:block;border-radius:8px;background:linear-gradient(90deg,var(--chip) 0%,var(--accent-soft) 50%,var(--chip) 100%);background-size:200% 100%;animation:sk 1.1s linear infinite}
.skel i:nth-child(1){width:40px;height:40px;border-radius:12px}.skel i:nth-child(2){width:80%;height:16px}.skel i:nth-child(3){width:95%;height:12px}.skel i:nth-child(4){width:60%;height:12px}
@keyframes sk{to{background-position:-200% 0}}
.t-boat{background:var(--t-boat-bg);color:var(--t-boat)}.t-bike{background:var(--t-bike-bg);color:var(--t-bike)}
.t-family{background:var(--t-family-bg);color:var(--t-family)}.t-food{background:var(--t-food-bg);color:var(--t-food)}
.t-love{background:var(--t-love-bg);color:var(--t-love)}

/* ---------- Chat ---------- */
.chat{flex:1;min-height:0;display:flex;flex-direction:column}
.chat-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.chat-id{display:flex;align-items:center;gap:12px}
.chat-id div:last-child{display:flex;flex-direction:column}
.chat-id span{font-size:13px;color:var(--muted)}
.btn-ghost{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-weight:600;font-size:14px}
.log{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding:16px 4px 8px 0;overscroll-behavior:contain}
.msg{display:flex;gap:12px;align-items:flex-start;animation:msgIn .35s ease-out}
.msg--user{justify-content:flex-end}
.bubble-user{max-width:72%;padding:14px 18px;border-radius:18px 18px 4px 18px;background:var(--accent);color:var(--on-accent);font-size:15px;line-height:1.5}
.bubble-ai{flex:1;min-width:0;display:flex;flex-direction:column;gap:14px;padding:18px 20px;border-radius:4px 18px 18px 18px;background:var(--card);border:1px solid var(--line);font-size:15px;line-height:1.55}
.typing{display:inline-flex;gap:5px;padding:14px 18px;border-radius:18px;background:var(--card);border:1px solid var(--line)}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:dot 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600}
.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.day{padding:14px;border-radius:12px;background:var(--chip);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px;animation:msgIn .4s ease-out both}
.day b{font:700 11.5px var(--f-head);color:var(--accent-ink);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between;gap:8px}
.day b em{font-style:normal;color:var(--muted);font-weight:600}
.day strong{font-weight:600;font-size:15px}
.day span{font-size:13px;color:var(--muted)}
.day a{font-size:13px;font-weight:700;color:var(--accent-ink);text-decoration:none;margin-top:2px}
.day a:hover{text-decoration:underline}
.ai-actions{display:flex;gap:8px;flex-wrap:wrap}
.ai-actions button{min-height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);color:var(--ink);font-size:14px;font-weight:600}
.ai-actions button.primary{background:var(--dark);color:var(--on-dark);border-color:var(--dark)}
.ai-actions button:disabled{opacity:.5;cursor:default}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who span{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:8px;background:var(--chip);border:1px solid var(--line);font-size:13px;font-weight:600}
.fine{font-size:12.5px;color:var(--muted);margin:0}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dot{0%,80%,100%{opacity:.25}40%{opacity:1}}

@media (max-height:740px){.card .desc{display:none}.cards{--cards-h:136px}.skel i:nth-child(4){display:none}}
@media (max-height:600px){.orb--hero{display:none}}
@media (max-width:760px){
  .days{grid-template-columns:1fr}
  /* idées en carrousel horizontal : la page ne défile pas */
  .cats{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
  .cat{flex:none;min-height:40px}
  .cards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;--cards-h:136px}
  .cards>*{flex:0 0 78%;scroll-snap-align:start}
  .skel i:nth-child(4){display:none}
  .card .desc{display:none}
  .bubble-user{max-width:85%}
  .composer textarea{font-size:16px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="nav">
  <div class="nav-in">
    <a class="brand" href="#"><i></i>Canal du Midi</a>
    <nav class="menu" aria-label="Menu principal"><span>En bateau</span><span>Vélo &amp; balades</span><span>Découvrir</span><span>Se loger</span><span>Manger &amp; Boire</span><span>Préparer</span></nav>
    <div class="tools">
      <span class="t"><svg viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></svg>Distances</span>
      <span class="t"><svg viewBox="0 0 24 24"><path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/></svg>Carte</span>
      <a class="cta" href="#" aria-current="page"><svg viewBox="0 0 24 24"><path d="M4 20L15 9M14 4v3M12.5 5.5h3M19 9v3M17.5 10.5h3"/></svg><span>Planifier mon voyage</span></a>
      <span class="avatar"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg></span>
    </div>
  </div>
</header>

<main class="main">
  <div class="wrap">

    <section id="hero" class="hero">
      <div class="orb orb--hero" id="mainOrb" aria-hidden="true">
        <div class="orb__glow"></div>
        <div class="orb__core"><span class="orb__blob b1"></span><span class="orb__blob b2"></span><span class="orb__blob b3"></span><span class="orb__blob b4"></span><span class="orb__swirl"></span><span class="orb__shine"></span></div>
      </div>
      <p class="hello">Bonjour, voyageur</p>
      <h1>Quel séjour imaginez-vous ?</h1>
    </section>

    <section id="chat" class="chat" hidden>
      <div class="chat-head">
        <div class="chat-id">
          <div class="orb orb--sm" aria-hidden="true"><div class="orb__core"><span class="orb__blob b1"></span><span class="orb__blob b2"></span><span class="orb__blob b3"></span><span class="orb__shine"></span></div></div>
          <div><strong>Assistant du Canal du Midi</strong><span id="statusText">En ligne</span></div>
        </div>
        <button type="button" class="btn-ghost" id="resetBtn">Nouveau séjour</button>
      </div>
      <div id="log" class="log" role="log" aria-live="polite"></div>
    </section>

    <form id="composer" class="composer">
      <label for="input" class="sr-only">Décrivez votre séjour</label>
      <textarea id="input" rows="2" placeholder="Décrivez votre séjour idéal…"></textarea>
      <button type="submit" class="send-btn" aria-label="Envoyer"><svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </form>

    <section id="ideas" class="ideas" aria-label="Idées proposées par l'IA">
      <div class="ideas-head">
        <svg viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 3v4M21 5h-4"/></svg>
        <span>L'IA vous propose</span><span class="cur" id="curCat">…</span>
      </div>
      <div class="cats" id="cats"></div>
      <div class="cards" id="cards" aria-live="polite"></div>
    </section>

  </div>
</main>

<template id="orbTpl">
  <div class="orb orb--xs" aria-hidden="true"><div class="orb__core"><span class="orb__blob b1"></span><span class="orb__blob b2"></span><span class="orb__blob b3"></span><span class="orb__shine"></span></div></div>
</template>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const hero = $('#hero'), chat = $('#chat'), ideas = $('#ideas');
  const log = $('#log'), form = $('#composer'), input = $('#input');
  const mainOrb = $('#mainOrb'), statusText = $('#statusText');
  const catsEl = $('#cats'), cardsEl = $('#cards'), curCat = $('#curCat');
  const sendBtn = form.querySelector('.send-btn'), wrap = $('.wrap');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  const ICON = {
    boat: '<path d="M2 20c2 1 4 1 6 0s4-1 6 0 4 1 6 0"/><path d="M4 16l1.5-4h13L20 16"/><path d="M12 12V3l5 6h-5"/>',
    bike: '<circle cx="5.5" cy="17" r="3.5"/><circle cx="18.5" cy="17" r="3.5"/><path d="M15 6h2l1.5 11M5.5 17 9 9h6l-3.5 8M9 9 8 6H6"/>',
    family: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>',
    food: '<path d="M3 2v7a3 3 0 0 0 6 0V2M6 2v20M18 15V2a4 4 0 0 0-4 4v6h4zM18 15v7"/>',
    love: '<path d="M19 14c1.5-1.5 3-3.2 3-5.5A5.5 5.5 0 0 0 16.5 3C14.7 3 13.5 3.5 12 5c-1.5-1.5-2.7-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4 3 5.5l7 7z"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>'
  };
  const svg = (k) => `<svg viewBox="0 0 24 24">${ICON[k]}</svg>`;

  /* Thèmes : placeholder qui s'écrit + idées synchronisées (toutes sur le canal) */
  const THEMES = [
    { key: 'boat', label: 'En bateau', prompts: [
        '3 jours en bateau sans permis entre Carcassonne et Castelnaudary…',
        'Une croisière d\'une journée avec passage d\'écluses, pour 4 amis…',
        'Une semaine en péniche de Béziers à l\'étang de Thau…' ],
      cards: [
        { t: 'Sans permis, au fil de l\'eau', d: 'Bateau électrique de Carcassonne à Castelnaudary, 17 écluses.', m: ['3 jours', 'Sans permis'] },
        { t: 'Les 9 écluses de Fonseranes', d: 'Croisière commentée au départ de Béziers, l\'ouvrage le plus célèbre.', m: ['1 journée', 'Croisière'] },
        { t: 'Jusqu\'à la Méditerranée', d: 'Péniche de Béziers à Agde et l\'étang de Thau, écluse ronde comprise.', m: ['7 jours', 'Péniche'] } ] },
    { key: 'bike', label: 'À vélo', prompts: [
        '4 jours à vélo de Toulouse à Carcassonne, bagages transportés…',
        'Une balade à vélo plate et ombragée, avec des enfants…',
        'Le canal à vélo électrique avec dégustations dans le Minervois…' ],
      cards: [
        { t: 'De Toulouse au Lauragais', d: 'Le chemin de halage jusqu\'au seuil de Naurouze et Castelnaudary.', m: ['3 jours', 'Facile'] },
        { t: 'Sous les platanes', d: 'Étapes de 15 km entre Trèbes et Homps, idéal avec des enfants.', m: ['2 jours', 'Tout plat'] },
        { t: 'Minervois à vélo électrique', d: 'Domaines viticoles entre Homps et Capestang, bagages transportés.', m: ['4 jours', 'VAE'] } ] },
    { key: 'family', label: 'En famille', prompts: [
        'Une semaine en famille avec deux enfants, entre vélo et baignade…',
        'Un gîte avec piscine près du canal pour 2 adultes et 3 enfants…',
        'Des activités au bord du canal pour des ados…' ],
      cards: [
        { t: 'Vélo, bateau et baignade', d: 'Castelnaudary → Trèbes, une journée sur l\'eau au milieu.', m: ['5 jours', 'Enfants 6-12'] },
        { t: 'Gîte et piscine dans le Minervois', d: 'Base fixe près d\'Homps, sorties à la journée.', m: ['7 nuits', 'Base fixe'] },
        { t: 'Canoë et Cité médiévale', d: 'Canoë sur le canal et visite de la Cité de Carcassonne.', m: ['3 jours', 'Ados'] } ] },
    { key: 'food', label: 'Vins & terroir', prompts: [
        'Un week-end gourmand entre cassoulet et vins du Minervois…',
        'Une route des vins le long du canal, sans voiture…',
        'Marchés et producteurs locaux autour de Béziers…' ],
      cards: [
        { t: 'Le cassoulet de Castelnaudary', d: 'Tables de tradition autour du Grand Bassin et du moulin de Cugarel.', m: ['2 jours', 'Gourmand'] },
        { t: 'Minervois au fil de l\'eau', d: 'Caves et domaines accessibles depuis le chemin de halage.', m: ['3 jours', 'Oenotourisme'] },
        { t: 'Marchés de l\'Hérault', d: 'Producteurs, huîtres de l\'étang de Thau et halles de Béziers.', m: ['3 jours', 'Terroir'] } ] },
    { key: 'love', label: 'En amoureux', prompts: [
        'Un week-end romantique en chambre d\'hôtes au bord de l\'eau…',
        'Surprendre ma compagne pour nos 10 ans de mariage…',
        'Deux nuits dans un hôtel de charme près de la Cité…' ],
      cards: [
        { t: 'Chambre d\'hôtes au fil de l\'eau', d: 'Maison d\'éclusier rénovée et dîner en terrasse.', m: ['2 nuits', 'Calme'] },
        { t: 'Dîner sur un bateau-restaurant', d: 'Croisière au coucher du soleil depuis Toulouse.', m: ['1 soirée', 'Surprise'] },
        { t: 'Carcassonne, la nuit', d: 'Cité illuminée et hôtel de charme au pied des remparts.', m: ['2 nuits', 'Charme'] } ] }
  ];

  let current = -1, jumpTo = null, hoverCards = false;
  THEMES.forEach((th, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'cat';
    b.innerHTML = svg(th.key) + th.label;
    b.addEventListener('click', () => { if (i !== current) jumpTo = i; });
    catsEl.append(b);
  });
  cardsEl.addEventListener('mouseenter', () => (hoverCards = true));
  cardsEl.addEventListener('mouseleave', () => (hoverCards = false));

  let genToken = 0;
  async function showTheme(i) {
    current = i;
    const th = THEMES[i], token = ++genToken;
    [...catsEl.children].forEach((c, k) => c.classList.toggle('is-active', k === i));
    curCat.textContent = th.label.toLowerCase();
    mainOrb.classList.add('is-thinking');
    [...cardsEl.children].forEach((c) => c.classList.add('out'));
    await sleep(reduce ? 0 : 280);
    if (token !== genToken) return;
    cardsEl.innerHTML = '<div class="skel"><i></i><i></i><i></i><i></i></div>'.repeat(3);
    await sleep(reduce ? 0 : 750);
    if (token !== genToken) return;
    cardsEl.innerHTML = '';
    th.cards.forEach((c, k) => {
      const el = document.createElement('button');
      el.type = 'button'; el.className = 'card';
      el.style.animationDelay = (k * 110) + 'ms';
      el.innerHTML = `<div class="card-top"><span class="card-ico t-${th.key}">${svg(th.key)}</span><span class="card-go">${svg('arrow')}</span></div>
        <strong></strong><span class="desc"></span><div class="meta">${c.m.map(() => '<span></span>').join('')}</div>`;
      el.querySelector('strong').textContent = c.t;
      el.querySelector('.desc').textContent = c.d;
      el.querySelectorAll('.meta span').forEach((s, n) => (s.textContent = c.m[n]));
      el.addEventListener('click', () => send(`${c.t} : ${c.d}`));
      cardsEl.append(el);
    });
    setTimeout(() => { if (token === genToken) mainOrb.classList.remove('is-thinking'); }, 500);
  }

  /* Placeholder qui s'écrit et s'efface */
  const paused = () => input.value.length > 0 || hero.hidden || hoverCards;
  async function waitWhilePaused() { while (paused() && jumpTo === null) await sleep(200); }
  async function typeText(txt) {
    for (let k = 1; k <= txt.length; k++) {
      if (jumpTo !== null) return false;
      await waitWhilePaused();
      input.placeholder = txt.slice(0, k) + '▍';
      await sleep(txt[k - 1] === ',' ? 220 : 28 + Math.random() * 55);
    }
    return true;
  }
  async function hold(txt, ms) {
    const end = Date.now() + ms; let on = true;
    while (Date.now() < end || paused()) {
      if (jumpTo !== null) return false;
      input.placeholder = txt + (on ? '▍' : ''); on = !on;
      await sleep(450);
    }
    return true;
  }
  async function eraseText(txt) {
    for (let k = txt.length; k >= 0; k--) {
      await waitWhilePaused();
      input.placeholder = txt.slice(0, k) + '▍';
      await sleep(jumpTo !== null ? 6 : 14 + Math.random() * 18);
    }
  }
  async function cycle() {
    let i = Math.floor(Math.random() * THEMES.length);
    const used = THEMES.map(() => -1);
    while (true) {
      if (hero.hidden) { await sleep(400); continue; }
      const th = THEMES[i];
      used[i] = (used[i] + 1) % th.prompts.length;
      const txt = th.prompts[used[i]];
      showTheme(i);
      if (reduce) { input.placeholder = txt; await sleep(6000); }
      else {
        await sleep(350);
        if (await typeText(txt)) await hold(txt, 2600);
        await eraseText(input.placeholder.replace('▍', ''));
        await sleep(250);
      }
      if (jumpTo !== null) { i = jumpTo; jumpTo = null; }
      else { let n; do { n = Math.floor(Math.random() * THEMES.length); } while (n === i); i = n; }
    }
  }
  cycle();

  const allOrbs = () => document.querySelectorAll('.orb');
  function setThinking(on) {
    allOrbs().forEach((o) => o.classList.toggle('is-thinking', on));
    statusText.textContent = on ? 'Je compose votre séjour…' : 'En ligne';
  }

  /* Conversation : plan → proposition de demande → e-mail dans le composer → confirmation */
  let busy = false, timer = null, stage = 'plan';
  form.addEventListener('submit', (e) => { e.preventDefault(); send(input.value); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(input.value); } });
  $('#resetBtn').addEventListener('click', reset);

  function send(text) {
    const t = (text || '').trim();
    if (!t || busy) return;
    hero.hidden = true; ideas.hidden = true; chat.hidden = false; wrap.classList.add('chatting');
    addUser(t);
    input.value = '';
    busy = true; sendBtn.disabled = true;
    const typing = addTyping();
    setThinking(true);
    timer = setTimeout(() => {
      typing.remove();
      if (stage === 'email' && /@/.test(t)) { addConfirm(t); stage = 'done'; input.placeholder = 'Une question sur votre séjour ?'; }
      else if (stage === 'email') { addText('Il me faut une adresse e-mail valide, par exemple marie@exemple.fr.'); }
      else { addPlan(mockReply(t)); input.placeholder = 'Ajustez : « plus calme », « sans voiture », « un jour de plus »…'; }
      busy = false; sendBtn.disabled = false;
      setThinking(false);
      input.focus();
    }, 1600);
  }
  function reset() {
    clearTimeout(timer);
    busy = false; sendBtn.disabled = false; stage = 'plan';
    log.innerHTML = '';
    chat.hidden = true; hero.hidden = false; ideas.hidden = false; wrap.classList.remove('chatting');
    setThinking(false); input.value = '';
  }

  const el = (tag, cls, txt) => { const n = document.createElement(tag); if (cls) n.className = cls; if (txt != null) n.textContent = txt; return n; };
  const orb = () => $('#orbTpl').content.firstElementChild.cloneNode(true);
  const scroll = () => log.scrollTo({ top: log.scrollHeight, behavior: 'smooth' });
  const aiRow = (bubble) => { const row = el('div', 'msg'); row.append(orb(), bubble); log.append(row); scroll(); };

  function addUser(text) { const row = el('div', 'msg msg--user'); row.append(el('div', 'bubble-user', text)); log.append(row); scroll(); }
  function addTyping() {
    const row = el('div', 'msg'); const o = orb(); o.classList.add('is-thinking');
    const t = el('div', 'typing'); t.setAttribute('aria-label', 'L\'assistant écrit'); t.append(el('i'), el('i'), el('i'));
    row.append(o, t); log.append(row); scroll(); return row;
  }
  function addText(text) { const b = el('div', 'bubble-ai'); b.append(el('div', null, text)); aiRow(b); }

  let lastPlan = null;
  function addPlan(r) {
    lastPlan = r;
    const b = el('div', 'bubble-ai');
    b.append(el('div', null, r.text));
    const pills = el('div', 'pills');
    pills.append(el('span', 'pill t-love', r.where), el('span', 'pill t-boat', r.when), el('span', 'pill t-family', r.extra));
    b.append(pills);
    const days = el('div', 'days');
    r.days.forEach((d, i) => {
      const c = el('div', 'day'); c.style.animationDelay = (i * 90) + 'ms';
      const head = el('b', null, d[0]); head.append(el('em', null, d[1]));
      const a = el('a', null, d[4] + ' →'); a.href = '#'; a.addEventListener('click', (e) => e.preventDefault());
      c.append(head, el('strong', null, d[2]), el('span', null, d[3]), a);
      days.append(c);
    });
    b.append(days);
    const acts = el('div', 'ai-actions');
    const ask = el('button', 'primary', 'Demander les disponibilités');
    const adj = el('button', null, 'Ajuster le séjour');
    const keep = el('button', null, 'Recevoir par e-mail');
    [ask, adj, keep].forEach((x) => (x.type = 'button'));
    ask.addEventListener('click', () => { acts.querySelectorAll('button').forEach((x) => (x.disabled = true)); askProviders(); });
    keep.addEventListener('click', () => { acts.querySelectorAll('button').forEach((x) => (x.disabled = true)); askEmail(false); });
    adj.addEventListener('click', () => { input.focus(); });
    acts.append(ask, adj, keep);
    b.append(acts);
    aiRow(b);
  }
  function askProviders() {
    const b = el('div', 'bubble-ai');
    b.append(el('div', null, `Je peux écrire à ces ${lastPlan.providers.length} prestataires pour vos dates. Ils vous répondront directement :`));
    const who = el('div', 'who'); lastPlan.providers.forEach((p) => who.append(el('span', null, p))); b.append(who);
    b.append(el('div', null, 'Quelle est votre adresse e-mail ? Écrivez-la ci-dessous.'));
    b.append(el('p', 'fine', 'Elle ne sera transmise qu\'à ces prestataires, après confirmation de votre part. Conservée 12 mois.'));
    aiRow(b); askEmail(true);
  }
  function askEmail(already) {
    if (!already) addText('Quelle est votre adresse e-mail ? Je vous y envoie le programme complet.');
    stage = 'email'; input.placeholder = 'votre@adresse.fr'; input.focus();
  }
  function addConfirm(mail) {
    const b = el('div', 'bubble-ai');
    b.append(el('div', null, `C'est noté. Je viens d'envoyer un e-mail à ${mail} : cliquez sur le lien pour confirmer, et vos demandes partent aussitôt.`));
    b.append(el('p', 'fine', 'Dans 3 jours, je vous demanderai qui vous a répondu.'));
    aiRow(b);
  }

  /* Réponse simulée (à remplacer par l'API) — [jour, km, lieu, description, prestataire] */
  function mockReply(q) {
    const s = q.toLowerCase();
    if (/bateau|péniche|croisi|écluse|permis/.test(s)) return {
      text: 'Belle idée. Voici un parcours sur l\'eau à rythme tranquille, environ 20 km par jour. Je peux changer la durée ou le point de départ.',
      where: 'Carcassonne → Castelnaudary', when: '3 jours', extra: 'Sans permis',
      providers: ['Location Bateaux du Midi', 'Domaine de l\'Écluse', 'Le Grand Bassin'],
      days: [['Jour 1', 'km 105', 'Carcassonne', 'Prise du bateau au port, première écluse au coucher du soleil.', 'Location Bateaux du Midi'],
             ['Jour 2', 'km 83', 'Bram et Villepinte', 'Navigation entre les platanes, marché de Bram le matin.', 'Domaine de l\'Écluse'],
             ['Jour 3', 'km 66', 'Castelnaudary', 'Cassoulet face au Grand Bassin, restitution du bateau.', 'Le Grand Bassin'],
             ['En plus', 'à bord', 'Vélos embarqués', 'Pour explorer le chemin de halage aux escales.', 'Location Bateaux du Midi']]
    };
    if (/vélo|velo|pédal|vae/.test(s)) return {
      text: 'Voici une échappée à vélo avec des étapes courtes et les bagages transportés.',
      where: 'Toulouse → Castelnaudary', when: '3 jours', extra: 'Facile',
      providers: ['Cycles du Lauragais', 'Chambres du Seuil', 'Canal Bagages'],
      days: [['Jour 1', 'km 0', 'Toulouse', 'Retrait des vélos au port de l\'Embouchure, 25 km jusqu\'à Montgiscard.', 'Cycles du Lauragais'],
             ['Jour 2', 'km 51', 'Seuil de Naurouze', 'Le point de partage des eaux et l\'obélisque de Riquet.', 'Chambres du Seuil'],
             ['Jour 3', 'km 66', 'Castelnaudary', 'Arrivée au Grand Bassin, les bagages vous attendent.', 'Canal Bagages']]
    };
    if (/famil|enfant|ados|piscine/.test(s)) return {
      text: 'Une proposition en famille, sans longues étapes, avec une journée sur l\'eau.',
      where: 'Castelnaudary → Trèbes', when: '5 jours', extra: 'Enfants 6-12',
      providers: ['Cycles du Lauragais', 'La Maison de l\'Éclusier', 'Hôtel du Port Vauban', 'Bateaux de l\'Écluse triple'],
      days: [['Jour 1', 'km 66', 'Castelnaudary', 'Vélos enfants et premier cassoulet au Grand Bassin.', 'Cycles du Lauragais'],
             ['Jour 2', 'km 82', 'Villepinte', '16 km tout plats, chambre familiale au bord de la piste.', 'La Maison de l\'Éclusier'],
             ['Jour 3', 'km 105', 'Carcassonne', 'La Cité en fin de journée, nuit face au canal.', 'Hôtel du Port Vauban'],
             ['Jour 4', 'km 118', 'Trèbes', 'Journée sans vélo : croisière et écluse triple.', 'Bateaux de l\'Écluse triple']]
    };
    return {
      text: 'Voici une première proposition. Je peux l\'ajuster à votre rythme, votre budget ou vos envies.',
      where: 'Béziers → Agde', when: '2 jours', extra: '2 personnes',
      providers: ['Croisières de Fonseranes', 'Chambres de l\'Orb', 'Bistrot de l\'Écluse ronde'],
      days: [['Jour 1', 'km 208', 'Béziers', 'Les 9 écluses de Fonseranes en croisière commentée.', 'Croisières de Fonseranes'],
             ['Soir', 'km 208', 'Béziers', 'Chambre d\'hôtes avec vue sur l\'Orb.', 'Chambres de l\'Orb'],
             ['Jour 2', 'km 231', 'Agde', 'L\'écluse ronde et déjeuner au bord de l\'Hérault.', 'Bistrot de l\'Écluse ronde'],
             ['En plus', 'km 240', 'Étang de Thau', 'Les Onglous, là où le canal rejoint la lagune.', 'Voir le phare des Onglous']]
    };
  }
})();
</script>
